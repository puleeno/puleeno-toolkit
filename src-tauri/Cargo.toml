[package]
name = "puleeno-toolkit"
version = "0.1.0"
description = "Puleeno Toolkit - Timer App"
authors = ["Puleeno"]
edition = "2021"

[lib]
name = "puleeno_toolkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
